<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Screencast Test Page</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      background: linear-gradient(135deg, #1e3a8a 0%, #7e22ce 100%);
    }
    .name {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .id {
      font-family: ui-monospace, monospace;
      font-size: 0.95rem;
      opacity: 0.6;
    }
    .pulse {
      width: 28px;
      height: 28px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1;   }
      50%      { transform: scale(1.5); opacity: 0.5; }
    }
    .clock {
      font-size: 9rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
    }
    .bar {
      width: 60%;
      height: 10px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      overflow: hidden;
    }
    .bar-fill {
      width: 25%;
      height: 100%;
      background: linear-gradient(90deg, #fff, #c4b5fd);
      border-radius: 5px;
      animation: slide 2s linear infinite;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to   { transform: translateX(400%); }
    }
  </style>
</head>
<body>
  <div class="name" id="name">—</div>
  <div class="id"   id="id">—</div>
  <div class="pulse"></div>
  <div class="clock" id="clock">0.0</div>
  <div class="bar"><div class="bar-fill"></div></div>

  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('name').textContent = params.get('name') || 'unnamed';
    document.getElementById('id').textContent   = params.get('id')   || '—';

    const clock = document.getElementById('clock');
    const start = performance.now();
    function tick() {
      clock.textContent = ((performance.now() - start) / 1000).toFixed(1);
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
